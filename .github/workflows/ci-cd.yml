# Pipeline CI/CD de HeatAlert
#
#   Pull request vers main  →  1. Qualité  →  2. Tests + 3. Base MySQL          (CI)
#   Push / merge sur main   →  … puis  4. Image Docker  →  5. Déploiement Render  (CD)

name: CI/CD HeatAlert

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:   # lancement manuel depuis l'onglet Actions

# Un nouveau push annule le pipeline encore en cours sur la même branche
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.2'
  PHP_EXTENSIONS: mbstring, intl, pdo_sqlite, pdo_mysql

jobs:
  # ─── CI ─────────────────────────────────────────────────────────────────
  qualite:
    name: 1 · Qualité & sécurité
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de PHP ${{ env.PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - name: Cache des dépendances Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}

      - name: Validation de composer.json
        run: composer validate --no-check-publish

      - name: Installation des dépendances
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Vérification de la syntaxe PHP
        run: find app bootstrap config database routes tests -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Audit de sécurité des dépendances
        run: composer audit

  tests:
    name: 2 · Tests automatisés
    needs: qualite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}

      - name: Installation des dépendances
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Préparation de l'environnement
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Tests unitaires et fonctionnels (PHPUnit, SQLite en mémoire)
        run: php artisan test

  base-mysql:
    name: 3 · Migrations & seeders (MySQL)
    needs: qualite
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: heatalert
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: heatalert
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}

      - name: Installation des dépendances
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Préparation de l'environnement
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Migrations et données de démonstration sur un vrai MySQL
        run: php artisan migrate:fresh --seed --force

  # ─── CD ─────────────────────────────────────────────────────────────────
  docker:
    name: 4 · Image Docker
    needs: [tests, base-mysql]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Nom de l'image (en minuscules, exigé par le registre)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/heatalert" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Construction de l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:latest,${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test de l'image (le conteneur doit démarrer et répondre)
        run: |
          docker run -d --name heatalert-test -p 8080:80 \
            -e APP_KEY="base64:$(openssl rand -base64 32)" "$IMAGE:latest"
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8080/up > /dev/null; then
              echo "Conteneur opérationnel"; curl -fsS -o /dev/null http://localhost:8080/coupures; exit 0
            fi
            sleep 5
          done
          echo "Le conteneur ne répond pas"; docker logs heatalert-test; exit 1

      - name: Connexion au registre GitHub (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publication de l'image
        run: |
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"

  deploy:
    name: 5 · Déploiement en production
    needs: docker
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    steps:
      - name: Déclenchement du déploiement sur Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::Le secret RENDER_DEPLOY_HOOK_URL n'est pas configuré (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL" > /dev/null
          echo "Déploiement demandé à Render."

      - name: Vérification du site en ligne
        if: vars.APP_URL != ''
        run: |
          # Render reconstruit puis redémarre le service : on attend jusqu'à 10 minutes
          sleep 60
          for _ in $(seq 1 54); do
            if curl -fsS "${{ vars.APP_URL }}/up" > /dev/null; then
              echo "Site en ligne : ${{ vars.APP_URL }}"; exit 0
            fi
            sleep 10
          done
          echo "::error::Le site ne répond pas sur ${{ vars.APP_URL }}/up"; exit 1
